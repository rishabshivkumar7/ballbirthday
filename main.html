<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ritu's 25th Birthday Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Give+You+Glory&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF1E9;
    --ink:#221F1B;
    --ink-soft:#5C5650;
    --pink:#E4749C;
    --pink-deep:#D45C86;
    --pink-pale:#F6C9D8;
    --gold:#F0C572;
    --lavender:#B78EDE;
    --rule:rgba(34,31,27,.14);
    --card:#FFFDFB;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(228,116,156,.08), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(183,142,222,.10), transparent 45%),
      var(--cream);
    color:var(--ink);
    font-family:'Playfair Display', Georgia, serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .page{
    max-width:480px;
    margin:0 auto;
    padding:36px 24px calc(48px + env(safe-area-inset-bottom));
    position:relative;
    overflow:hidden;
  }

  /* ---------- Hero ---------- */
  .hero{
    text-align:center;
    margin-bottom:8px;
  }

  .eyebrow{
    margin:0 0 10px;
    font-size:13px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:500;
    opacity:0;
    animation:floatIn .7s ease forwards;
  }

  .title{
    font-family:'Give You Glory', cursive;
    font-weight:400;
    font-size:clamp(48px, 14vw, 68px);
    line-height:1.02;
    margin:0 0 8px;
    color:var(--ink);
    opacity:0;
    animation:floatIn .8s ease forwards .12s;
  }

  .art-wrap{
    width:min(78%, 300px);
    margin:6px auto 4px;
    opacity:0;
    animation:floatIn .9s ease forwards .26s;
  }
  .art-wrap svg{width:100%;height:auto;display:block;}

  .sparkle{animation:twinkle 2.8s ease-in-out infinite;transform-origin:center;}

  @media (prefers-reduced-motion: reduce){
    .sparkle{animation:none;}
    .eyebrow,.title,.art-wrap,.details,.rsvp{animation:none;opacity:1;}
    .facet-overlay{animation:none;}
  }

  /* ---------- Details ---------- */
  .details{
    margin-top:18px;
    background:var(--card);
    border-radius:20px;
    padding:26px 22px 20px;
    box-shadow:0 18px 40px -22px rgba(34,31,27,.25);
    opacity:0;
    animation:floatIn .8s ease forwards .4s;
  }

  .detail-block{text-align:center;padding:6px 0;}

  .detail-label{
    margin:0 0 6px;
    font-weight:700;
    font-size:14px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--pink-deep);
  }

  .detail-time{
    margin:0 0 10px;
    font-weight:700;
    font-size:19px;
    letter-spacing:.02em;
    text-transform:uppercase;
  }

  .detail-address{
    display:inline-block;
    color:var(--ink);
    text-decoration:none;
    font-size:18px;
    line-height:1.5;
    border-bottom:1px solid var(--rule);
    padding-bottom:2px;
    transition:opacity .15s ease;
  }
  .detail-address:active{opacity:.6;}
  .detail-address .arrow{color:var(--pink-deep); font-size:14px; margin-left:2px;}

  .venue-link{
    display:block;
    margin-top:10px;
    font-family:'Playfair Display', serif;
    font-size:14px;
    font-style:italic;
    color:var(--pink-deep);
    text-decoration:none;
  }
  .venue-link:active{opacity:.6;}

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:18px 0;
    color:var(--pink);
  }
  .divider::before,.divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--rule);
  }

  /* ---------- RSVP ---------- */
  .rsvp{
    margin-top:26px;
    text-align:center;
    opacity:0;
    animation:floatIn .8s ease forwards .52s;
  }

  .rsvp-heading{
    font-weight:700;
    font-size:15px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 16px;
  }

  .rsvp-btn{
    appearance:none;
    border:none;
    background:linear-gradient(120deg, var(--pink), var(--pink-deep));
    color:#fff;
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:.02em;
    padding:16px 28px;
    border-radius:999px;
    min-height:52px;
    width:100%;
    max-width:320px;
    cursor:pointer;
    box-shadow:0 14px 26px -12px rgba(212,92,134,.55);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .rsvp-btn:active{transform:scale(.97);}
  .rsvp-btn:disabled{opacity:.6;cursor:default;}

  .rsvp-form{
    max-width:320px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .rsvp-form[hidden]{display:none;}

  .rsvp-form input[type="text"]{
    font-family:'Playfair Display', serif;
    font-size:16px;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid var(--rule);
    background:var(--card);
    color:var(--ink);
    outline:none;
  }
  .rsvp-form input[type="text"]:focus{border-color:var(--pink);}

  .guest-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:10px 16px;
  }
  .guest-row label{font-size:14px;color:var(--ink-soft);}
  .guest-row input[type="number"]{
    width:56px;
    font-family:'Playfair Display', serif;
    font-size:16px;
    text-align:center;
    border:none;
    background:transparent;
    color:var(--ink);
    outline:none;
  }

  .rsvp-note{
    font-size:12px;
    color:var(--ink-soft);
    margin:2px 0 0;
  }

  .rsvp-confirmed{
    background:var(--card);
    border-radius:16px;
    padding:18px;
    max-width:320px;
    margin:0 auto;
    box-shadow:0 14px 30px -20px rgba(34,31,27,.3);
  }
  .confirmed-msg{margin:0;font-size:17px;font-weight:600;}

  .guest-list{margin-top:24px;}
  .guest-count{
    font-size:13px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 10px;
  }
  #guest-names{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  #guest-names li{
    background:var(--pink-pale);
    color:var(--pink-deep);
    font-family:'Playfair Display', serif;
    font-size:13px;
    font-weight:600;
    padding:7px 13px;
    border-radius:999px;
  }
  #guest-names li .plus{color:var(--ink-soft);font-weight:500;}

  .footer{
    text-align:center;
    margin-top:34px;
    font-style:italic;
    color:var(--ink-soft);
    font-size:14px;
  }

  @keyframes floatIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes twinkle{
    0%,100%{opacity:.25; transform:scale(.85);}
    50%{opacity:1; transform:scale(1.15);}
  }
  @keyframes glint{
    0%,100%{opacity:.35;}
    50%{opacity:.62;}
  }
  .facet-overlay{animation:glint 3.4s ease-in-out infinite;}
</style>
</head>
<body>
  <div class="page">

    <header class="hero">
      <p class="eyebrow">You're Invited To</p>
      <br>
      <h1 class="title">Ritu's<br>Birthday Party</h1>

      <div class="art-wrap">
        <svg viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Disco ball with 25th birthday numeral">
          <defs>
            <linearGradient id="ballGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#F3C56E"/>
              <stop offset="45%" stop-color="#E86A9B"/>
              <stop offset="100%" stop-color="#B98FE0"/>
            </linearGradient>
            <linearGradient id="numGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#F3A9C4"/>
              <stop offset="100%" stop-color="#E4749C"/>
            </linearGradient>
            <pattern id="facetGrid" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(45 245 172)">
              <path d="M0 0H15M0 0V15" stroke="#ffffff" stroke-width="1" opacity="0.55"/>
            </pattern>
          </defs>

          <!-- 25 numeral, sits fully to the left of the ball -->
          <text x="15" y="215" font-family="Playfair Display, serif" font-weight="900" font-size="125" fill="url(#numGradient)" opacity="0.92">25</text>

          <!-- mount string -->
          <line x1="245" y1="18" x2="245" y2="80" stroke="#C9A25E" stroke-width="2"/>
          <rect x="237" y="10" width="16" height="9" rx="2" fill="#8A7250"/>

          <!-- disco ball -->
          <circle cx="245" cy="172" r="80" fill="url(#ballGradient)"/>
          <circle cx="245" cy="172" r="80" fill="url(#facetGrid)" class="facet-overlay"/>
          <ellipse cx="215" cy="140" rx="20" ry="11" fill="#ffffff" opacity="0.25"/>

          <!-- sparkles -->
          <text x="60" y="90" class="sparkle" font-size="22" fill="#E4749C" style="animation-delay:.1s">✦</text>
          <text x="325" y="110" class="sparkle" font-size="16" fill="#B98FE0" style="animation-delay:.6s">✦</text>
          <text x="300" y="245" class="sparkle" font-size="20" fill="#F0C572" style="animation-delay:1.1s">✦</text>
          <text x="50" y="255" class="sparkle" font-size="14" fill="#E4749C" style="animation-delay:1.6s">✦</text>
          <text x="270" y="50" class="sparkle" font-size="15" fill="#E4749C" style="animation-delay:.9s">✦</text>
        </svg>
      </div>
    </header>

    <section class="details">
      <div class="detail-block">
        <p class="detail-label">Pregame & Snacks</p>
        <p class="detail-time">7:00 PM &middot; Sat, Aug 15 2026</p>
        <a class="detail-address" href="https://www.google.com/maps/search/?api=1&query=546+4th+Ave+Apt+4B+Brooklyn+NY+11215" target="_blank" rel="noopener">
          546 4th Ave, Apt 4B<br>Brooklyn, NY 11215 <span class="arrow">↗</span>
        </a>
      </div>

      <div class="divider">✦</div>

      <div class="detail-block">
        <p class="detail-label">Main Event</p>
        <p class="detail-time">10:30 PM &middot; Same Night</p>
        <a class="detail-address" href="https://www.google.com/maps/search/?api=1&query=Pacha+New+York+140+Stewart+Ave+Brooklyn+NY+11237" target="_blank" rel="noopener">
          Lost Frequencies @ Pacha, Brooklyn<br>140 Stewart Ave <span class="arrow">↗</span>
        </a>
        <a class="venue-link" href="https://pacha-nyc.com/event/lost-frequencies-15-08-2026" target="_blank" rel="noopener">Get tickets here ↗</a>
      </div>
    </section>

    <section class="rsvp">
      <form id="rsvp-form" class="rsvp-form">
        <input id="rsvp-name" type="text" placeholder="Your name" required maxlength="40" autocomplete="name">
        <button type="submit" class="rsvp-btn">I'll Be There 🪩</button>
      </form>

      <div id="rsvp-confirmed" class="rsvp-confirmed" hidden>
        <p class="confirmed-msg">You're on the list<span id="confirmed-name"></span>! 🎉</p>
      </div>
    </section>

    <p class="footer">Can't wait to celebrate with you ✦</p>
  </div>

<script>
  const rsvpForm = document.getElementById('rsvp-form');
  const confirmedWrap = document.getElementById('rsvp-confirmed');
  const confirmedNameSpan = document.getElementById('confirmed-name');

  const RSVP_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxC6aHiFI7rVmKYAFs6V1RcK-oOgowodoH6Jm_nkcIfaeEOOqe4V0_Ko6kotOe8p-qQuA/exec';

  rsvpForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const nameInput = document.getElementById('rsvp-name');
    const name = nameInput.value.trim();
    if (!name) return;
    const submitBtn = rsvpForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Confirming…';

    try {
      const res = await fetch(RSVP_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ name })
      });
      const result = await res.json();
      if (!result.ok) throw new Error(result.error || 'Save failed');

      rsvpForm.hidden = true;
      confirmedNameSpan.textContent = `, ${name}`;
      confirmedWrap.hidden = false;
    } catch (err) {
      console.error('RSVP save failed:', err);
      submitBtn.disabled = false;
      submitBtn.textContent = "I'll Be There 🪩";
      alert("Couldn't save your RSVP — please try again.");
    }
  });
</script>
</body>
</html>
